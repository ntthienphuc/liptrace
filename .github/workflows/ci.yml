name: software-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: liptrace demo --out demo_run
      - run: python scripts/fault_benchmark.py --out fault_report.json
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_dist.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: |
            fault_report.json
            demo_run/receipt.json
            dist/
  onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev,onnx]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: liptrace demo --out demo_run --onnx
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-parity
          path: |
            demo_run/receipt.json
            demo_run/onnx_comparison.json
